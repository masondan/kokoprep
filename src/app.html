<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		
		<!-- SEO Meta Tags -->
		<title>KokoPrep</title>
		<meta name="description" content="A revision buddy to help young stars sparkle in their Nigerian JSS Common Entrance examination." />
		<meta name="keywords" content="JSCE, JSS, Common Entrance, Nigerian exam, revision, study, exam prep" />
		<meta name="author" content="KokoPrep" />
		
		<!-- Open Graph / Social Sharing -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="KokoPrep" />
		<meta property="og:description" content="A revision buddy to help young stars sparkle in their Nigerian JSS Common Entrance examination." />
		<meta property="og:image" content="/logos/logo-kokoprep-og.png" />
		<meta property="og:url" content="https://kokoprep.com" />
		<meta property="og:site_name" content="KokoPrep" />
		
		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="KokoPrep" />
		<meta name="twitter:description" content="A revision buddy to help young stars sparkle in their Nigerian JSS Common Entrance examination." />
		<meta name="twitter:image" content="/logos/logo-kokoprep-og.png" />
		
		<!-- PWA & App -->
		<meta name="theme-color" content="#ff0094" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="KokoPrep" />
		
		<!-- Icons -->
		<link rel="icon" type="image/x-icon" href="/logos/favicon-kokoprep.ico" />
		<link rel="icon" type="image/svg+xml" href="/logos/favicon-kokoprep.svg" />
		<link rel="apple-touch-icon" href="/logos/logo-kokoprep-touch.png" />
		<link rel="shortcut icon" href="/logos/favicon-kokoprep.ico" />
		
		<!-- Manifest -->
		<link rel="manifest" href="/manifest.json" />
		
		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
